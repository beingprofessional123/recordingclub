; PHP settings for api.recordingclub.in

; Error reporting level
error_reporting = E_ALL

; Display errors to the screen
display_errors = On

; Log errors to a file
log_errors = On
error_log = /path/to/your/error/log/api.recordingclub.in_error.log

; Maximum execution time of each script, in seconds
max_execution_time = 600

; Maximum amount of memory a script may consume, in megabytes
memory_limit = 900M

; File uploads
upload_max_filesize = 900M
post_max_size = 900M

; Maximum input variables accepted per request
max_input_vars = 1000

; Set the timezone
date.timezone = "Asia/Kolkata"

; Enable or disable PHP modules as needed
; extension=module_name.so

; Additional PHP settings specific to your application can be added here
