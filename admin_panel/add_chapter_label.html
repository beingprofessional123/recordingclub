<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add chapter contents</title>
</head>
<body>
<h1>Add contents</h1>
<form id="myform">
    <label for="numLabels">Number of Labels:</label>
    <input type="number" id="numLabels" name="numLabels" required>
    <button type="button" id="createFieldsBtn">Create Fields</button>
    <br>
    <div id="labelDurationFields"></div>
    <button type="button" id="convertBtn">Convert to Milliseconds</button>
    <br>
    <label for="book">Select Book:</label>
    <select id="book" name="book" required></select>
    <button type="button" id="loadChaptersBtn">Load Chapters</button>
    <label for="chapter">Select Chapter:</label>
    <select id="chapter" name="chapter" required></select>
    <br>
    <button type="submit" id="submit">Save</button>
</form>
<script>
    document.getElementById("createFieldsBtn").addEventListener("click", function () {
        let numLabels = parseInt(document.getElementById("numLabels").value);
        let labelDurationFields = document.getElementById("labelDurationFields");
        labelDurationFields.innerHTML = ""; // Clear previous fields

        for (let i = 1; i <= numLabels; i++) {
            let labelInput = document.createElement("input");
            labelInput.type = "text";
            labelInput.name = "label" + i;
            labelInput.placeholder = "Label " + i;
            labelInput.required = true;

            let durationInput = document.createElement("input");
            durationInput.type = "text";
            durationInput.name = "duration" + i;
            durationInput.placeholder = "Duration " + i + " (hh:mm:ss)";
            durationInput.required = true;

            labelDurationFields.appendChild(labelInput);
            labelDurationFields.appendChild(durationInput);
            labelDurationFields.appendChild(document.createElement("br"));
        }
    });

    document.getElementById("myform").addEventListener("submit", function (event) {
        event.preventDefault();
        let numLabels = parseInt(document.getElementById("numLabels").value);
        let book = document.getElementById("book").value;
        let chapter = document.getElementById("chapter").value;

        // Validation
        if (isNaN(numLabels) || numLabels <= 0) {
            alert("Please enter a valid number of labels");
            return;
        }
        if (book.trim() === "") {
            alert("Please select a book");
            return;
        }
        if (chapter.trim() === "") {
            alert("Please select a chapter");
            return;
        }

        let formData = new FormData();
        formData.append("book", book);
        formData.append("chapter", chapter);

        for (let i = 1; i <= numLabels; i++) {
            let label = document.getElementsByName("label" + i)[0].value;
            let duration = document.getElementsByName("duration" + i)[0].value;

            // Validation for each pair
            if (label.trim() === "") {
                alert("Label " + i + " cannot be empty");
                return;
            }
            if (duration.trim() === "") {
                alert("Duration " + i + " cannot be empty");
                return;
            }

            formData.append("label", label);
            formData.append("duration", duration);

        let xhr = new XMLHttpRequest();
        xhr.onreadystatechange = () => {
            if (xhr.readyState === XMLHttpRequest.DONE) {
                let my_response = JSON.parse(xhr.responseText);
                let error = my_response.error;
                var msg = my_response.msg;
            }
        };
        xhr.open("POST", "../books/add_chapter_label.php", true);
        xhr.send(formData);
        }
                alert(msg);

    });

 const getAllBooks = () => {
        let dropdown = document.getElementById("book");
        let xhr = new XMLHttpRequest();
        xhr.onreadystatechange = () => {
            if (xhr.readyState === XMLHttpRequest.DONE) {
                if (xhr.status === 200) {
                    let my_response = JSON.parse(xhr.responseText);
                    let books = my_response.books;
                    for (let i = 0; i < books.length; i++) {
                        let option = document.createElement("option");
                        option.innerHTML = books[i];
                        option.value = books[i];
                        dropdown.appendChild(option);
                    }
                } else {
                    console.error('Error fetching books:', xhr.status);
                }
            }
        };
        xhr.open("POST", "../books/get/get_books.php", true);
        xhr.send();
    };

    const getChapters = () => {
        let book = document.getElementById("book").value;
        let dropdown = document.getElementById("chapter");
        dropdown.innerHTML = ""; // Clear previous options
        let xhr = new XMLHttpRequest();
        xhr.onreadystatechange = () => {
            if (xhr.readyState === XMLHttpRequest.DONE) {
                if (xhr.status === 200) {
                    let my_response = JSON.parse(xhr.responseText);
                    let book_info = my_response.book_info;
                    let chapters = [];
                    for (let i = 0; i < book_info.length; i++) {
                        chapters[i] = book_info[i].chapter_title;
                    }
                    for (let i = 0; i < chapters.length; i++) {
                        let option = document.createElement("option");
                        option.innerHTML = chapters[i];
                        option.value = chapters[i];
                        dropdown.appendChild(option);
                    }
                } else {
                    console.error('Error fetching chapters:', xhr.status);
                }
            }
        };
        xhr.open("POST", "../books/get/get_chapters.php", true);
        let formData = new FormData();
        formData.append("book_title", book);
        xhr.send(formData);
    };

    document.getElementById("convertBtn").addEventListener("click", function () {
        let durationInputs = document.querySelectorAll('[name^="duration"]');
        durationInputs.forEach(function (durationInput) {
            let durationValue = durationInput.value;
            if (!isValidDuration(durationValue)) {
                alert("Duration should be in the format hh:mm:ss");
                return;
            }
            let timeArray = durationValue.split(":");
            let milliseconds = ((parseInt(timeArray[0]) * 60 + parseInt(timeArray[1])) * 60 + parseInt(timeArray[2])) * 1000;
            durationInput.value = milliseconds;
        });
    });

    document.getElementById("loadChaptersBtn").addEventListener("click", function () {
        getChapters();
    });

    window.addEventListener("load", function () {
        getAllBooks();
    });

    function isValidDuration(duration) {
        const durationRegex = /^([0-9]{2}):([0-9]{2}):([0-9]{2})$/;
        return durationRegex.test(duration);
    }
</script>
</body>
</html>
